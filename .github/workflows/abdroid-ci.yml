name: LivasODV Android 2.3.6 CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livas-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify + Test + Lint + Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify workflow and Gradle Wrapper
        shell: bash
        run: |
          echo "=== LivasODV Android 2.3.6 CI - FORCE GRADLE 8.13 ==="
          echo "This workflow intentionally does NOT use gradle/actions/setup-gradle."
          chmod +x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          echo "Forcing a single Gradle 8.13 distributionUrl..."
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path("gradle/wrapper/gradle-wrapper.properties")
          lines = [line for line in p.read_text().splitlines() if not line.startswith("distributionUrl=")]
          lines.append(r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip")
          p.write_text("\n".join(lines) + "\n")
          PYFIX
          echo "--- gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties
          test "$(grep -c '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties)" = "1"
          grep -q '^distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip$' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
          GRADLE_VERSION="$(./gradlew --version | awk '/^Gradle / {print $2; exit}')"
          test "$GRADLE_VERSION" = "8.13"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Validate project files
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          ! grep -RInE 'service_role|sb_secret_' app/src/main || (echo 'Secret key detected in client source' && exit 1)

      - name: Test + Lint + Compile APK debug
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LivasODV-2.3.6-verification-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/**
            app/build/outputs/logs/**

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LivasODV-Android-2.3.6-RC-debug
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/apk/debug/*.apk
