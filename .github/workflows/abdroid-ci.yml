name: LivasODV Android 2.3.1 CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livas-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify + Test + Lint + Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout RC 2.3.1
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Force Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: false

      - name: Verify Gradle version
        shell: bash
        run: |
          echo "=== LivasODV Android 2.3.1 CI HOTFIX ==="
          gradle --version
          GRADLE_VERSION="$(gradle --version | awk '/^Gradle / {print $2; exit}')"
          if [ "$GRADLE_VERSION" != "8.13" ]; then
            echo "ERRORE: atteso Gradle 8.13, trovato $GRADLE_VERSION"
            exit 1
          fi

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Validate project files
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'gradle-8.13-bin.zip' gradle/wrapper/gradle-wrapper.properties
          ! grep -RInE 'service_role|sb_secret_' app/src/main || (echo 'Secret key detected in client source' && exit 1)

      - name: Test + Lint + Compile APK debug
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LivasODV-2.3.1-verification-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/**
            app/build/outputs/logs/**

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LivasODV-Android-2.3.1-RC-debug
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/apk/debug/*.apk
